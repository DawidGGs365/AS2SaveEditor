name: Release

# Every push to main builds all platforms and updates one rolling release per platform:
#   android-latest, ios-latest, linux-latest, macos-latest, web-latest, windows-latest
# Manual runs ("Run workflow") on other branches only keep the files as workflow artifacts.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "icons/README.md", "patches/README.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^version:[[:space:]]*\([0-9][^+[:space:]]*\).*/\1/p' pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, title: Linux, os: ubuntu-latest }
          - { platform: windows, title: Windows, os: windows-latest }
          - { platform: macos, title: macOS, os: macos-15-intel }
          - { platform: android, title: Android, os: ubuntu-latest }
          - { platform: ios, title: iOS, os: macos-15-intel }
          - { platform: web, title: Web, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed to create the rolling release
    # Runs for the same platform never overlap (a newer waiting run replaces an older waiting one).
    concurrency:
      group: rolling-${{ matrix.platform }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: pip install pillow

      - name: Decode Android keystore
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          else
            echo "No KEYSTORE_BASE64 - APK will be debug-signed."
          fi

      # Android signing is optional: build.gradle.kts reads these env vars directly; without the secrets the APK is debug-signed.
      - name: Build and package (build_<platform>.py)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python build_${{ matrix.platform }}.py --version "$VERSION" --build-number "$BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      # Replaces the whole release (and moves the tag to this commit) so old files never pile up.
      - name: Publish rolling release (${{ matrix.platform }}-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.platform }}-latest
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          # Description = .github/SHRTCHNGLOG.md (edit it before you push) + a small build footer
          {
            cat .github/SHRTCHNGLOG.md
            printf '\n\n---\n%s build of commit %s (build %s) - %s\n' "${{ matrix.title }}" "${GITHUB_SHA::7}" "$BUILD_NUMBER" "$RUN_URL"
          } > release-notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "v$VERSION" \
            --notes-file release-notes.md
