name: asseditor
description: Save editor for Animal Shelter 2 (.save files, .NET BinaryFormatter).
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.3
  shared_preferences: ^2.3.2

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gamedb.json
    - assets/l10n.json
